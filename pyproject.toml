[project]
name = "my-finance-ai"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "LeonardoBringel", email = "leo.sbringel@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cryptography>=46.0.5",
    "fastapi>=0.115.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.48",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pre-commit>4.3.0",
    "pytest>=9.0.3",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.black]
line-length = 80

[tool.isort]
profile = "black"
line_length = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
